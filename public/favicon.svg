<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Shield body -->
  <path
    d="M16 2L4 7v8c0 7.18 5.15 13.9 12 15.5C22.85 28.9 28 22.18 28 15V7L16 2Z"
    fill="#0C0F14"
    stroke="#4F8EF7"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Subtle inner shield glow fill -->
  <path
    d="M16 4.5L6 8.8V15c0 6.1 4.38 11.8 10 13.2 5.62-1.4 10-7.1 10-13.2V8.8L16 4.5Z"
    fill="url(#shieldFill)"
  />

  <!-- Horizontal scan line (middle) -->
  <line
    x1="8.5"
    y1="15.5"
    x2="23.5"
    y2="15.5"
    stroke="#4F8EF7"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.4"
  />

  <!-- Checkmark / tick — bold, centered -->
  <polyline
    points="10.5,15.5 14,19 21.5,11"
    stroke="#4F8EF7"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Top-right accent dot -->
  <circle cx="23.5" cy="9.5" r="2.5" fill="#4F8EF7" opacity="0.9" />
  <circle cx="23.5" cy="9.5" r="1.2" fill="#0C0F14" />

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="shieldFill" x1="16" y1="4" x2="16" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F8EF7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#4F8EF7" stop-opacity="0.02" />
    </linearGradient>
  </defs>
</svg>
